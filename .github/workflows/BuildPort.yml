name: Construct World of Padman for R36S

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm64
    container:
      image: ubuntu:20.04

    steps:
      - name: Install System Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
              git \
              sudo \
              curl \
              python3 \
              cmake \
              build-essential \
              libsdl2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libjpeg-dev \
              libvorbis-dev \
              libogg-dev \
              ccache \
              binutils

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-patch-arm64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-patch-arm64-

      - name: Make Patch Script Executable
        run: chmod +x patch_arm64.py

      - name: Run Patch Script
        run: python3 patch_arm64.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldofpadman-r36s-port
          path: dist/ports/
          if-no-files-found: error
