name: Construct World of Padman for RK3326 (R36S)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/BuildPort.yml'
      - '.github/scripts/patch_arm64.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout (mit Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up QEMU fuer arm64-Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write in-container build script
        run: |
          mkdir -p work
          cp .github/scripts/patch_arm64.py work/patch_arm64.py
          cat > work/build.sh << 'BUILD_SCRIPT_EOF'
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget curl file python3 cmake ccache \
            libsdl2-dev libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev
          git config --global --add safe.directory '*'

          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"

          ccache -M 2G
          export CC="ccache gcc"
          export CXX="ccache g++"

          cd /work/src
          python3 patch_arm64.py
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container (GLIBC 2.31)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/work/src \
            -v "${{ github.workspace }}/work":/work/scripts \
            -w /work/src \
            ubuntu:20.04 bash -c "cp /work/scripts/build.sh /work/scripts/patch_arm64.py /work/src/ && bash build.sh"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldofpadman-r36s-arm64
          path: |
            out/game/
            out/libs.aarch64/
          if-no-files-found: error
