name: Construct World of Padman R36S (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: QEMU für ARM64 einrichten
        uses: docker/setup-qemu-action@v3

      - name: Ccache Ordner erstellen
        run: mkdir -p .ccache

      - name: Build im ARM64 Docker Container
        run: |
          docker run --rm --privileged --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e CC="ccache gcc" \
            -e CXX="ccache g++" \
            arm64v8/ubuntu:20.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo '=== CONTAINER HARDWARE CHECK ==='
            free -m
            df -h /work
            
            echo '=== APT INSTALLATION ==='
            apt-get update -qq && apt-get install -y --no-install-recommends \
              build-essential cmake python3 git libsdl2-dev libopenal-dev \
              libcurl4-openssl-dev ccache
            
            ccache -M 2G
            echo '=== CCACHE STATUS VOR BUILD ==='
            ccache -s
            
            cd /work
            python3 .github/scripts/patch_arm64.py
            
            echo '=== CCACHE STATUS NACH BUILD ==='
            ccache -s
          "

      - name: Artifacts hochladen (Erfolg)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldOfPadman-R36S
          path: dist/

      - name: Debug Logs hochladen (Fehlerfall)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Failure-Logs
          path: |
            build/CMakeFiles/*.log
            build/CMakeCache.txt
